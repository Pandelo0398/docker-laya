apiVersion: apps/v1
kind: Deployment
metadata:
  name: laya
  namespace: laya-classifer
  labels:
    app.kubernetes.io/name: laya
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: laya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laya
    spec:
      containers:
        - name: laya
          image: auenkr/laya-server:laya-english-amd64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
